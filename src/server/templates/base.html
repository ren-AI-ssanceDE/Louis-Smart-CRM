<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{subject}}</title>
</head>
<body>
  <table border="0" cellpadding="0" cellspacing="0" width="100%" class="email-bg">
    <tr>
      <td align="center">
        <!-- Hauptbox -->
        <table border="0" cellpadding="0" cellspacing="0" width="100%" class="email-container">
          
          <!-- Inhaltsbereich -->
          <tr>
            <td class="email-body">
              <!-- Eingebetteter dynamischer Inhalts-Slot -->
              <div class="user-content">
                {{content}}
              </div>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
